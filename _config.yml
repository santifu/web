# GitHub Pages configuration
# This file tells GitHub Pages how to build your site.
# No build step needed — it serves index.html directly.

title: Santi Fuentemilla
description: Maker, researcher, and educator at Fab Lab Barcelona
url: ""         # Replace with: https://yourusername.github.io
baseurl: ""     # Leave empty if deployed at root (yourusername.github.io)
                # Or set to "/repo-name" if hosted from a subdirectory

# Theme: none — we use custom CSS
theme: null

# Exclude files from the built site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
